name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: |
          unzip -q -o "$(ls *.zip | head -1)" -d src
          echo "PROJ=$(dirname "$(find src -name settings.gradle | head -1)")" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        run: gradle -p "$PROJ" assembleDebug --no-daemon
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$PROJ/app/build/outputs/apk/debug/app-debug.apk" LittleSchoolbag.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest LittleSchoolbag.apk --title "Little Schoolbag" --notes "Tap LittleSchoolbag.apk to download, then open it to install."
